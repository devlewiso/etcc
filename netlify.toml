[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # jsdom 30 (used by scripts/prerender.js via its undici dep) needs Node 22+.
  # On Node 20 the build crashes with "webidl.util.markAsUncloneable is not a function".
  NODE_VERSION = "22"

# Long-cache hashed assets (Vite fingerprints filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always revalidate so prerendered content updates land
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
